<style>
  :root {
    --bg: #050506;
    --ink: #f4f3f0;
    --dim: rgba(244,243,240,.62);
    --faint: rgba(244,243,240,.48);
    --line: rgba(244,243,240,.14);
    --accent: #9be8f0;
    --accent-rgb: 155, 232, 240;
    --font: 'Switzer', 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow-x: hidden; }
  .package-promo-fallback { display: none !important; }
  html.package-promo-hidden [data-package-promo] { display: none !important; }
  html.package-promo-hidden .package-promo-fallback { display: inline-block !important; }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .skip { position: fixed; top: 12px; left: 4vw; z-index: 70; background: var(--bg); color: var(--accent);
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    text-decoration: none; border: 1px solid rgba(var(--accent-rgb),.3); border-radius: 3px; padding: 12px 16px;
    transform: translateY(-200%); }
  .skip:focus { transform: none; }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
  section { position: relative; padding: 110px 6vw; max-width: 1440px; margin: 0 auto; }
  h2.big { font-weight: 800; text-transform: uppercase; letter-spacing: -.01em;
    font-size: clamp(34px, 5.2vw, 76px); line-height: .98; margin: 18px 0 10px; }
  .rule { border: 0; border-top: 1px solid var(--line); max-width: calc(1440px - 12vw); margin: 0 auto; }
  a { color: inherit; }

  /* reveal-on-scroll */
  .rv { opacity: 0; transform: translateY(22px); transition: opacity .8s ease, transform .8s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }

  /* ── nav ── */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
  nav { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4vw; background: rgba(5,5,6,.94);
    backdrop-filter: blur(14px); }
  nav .logo { font-weight: 800; letter-spacing: .06em; font-size: 15px; text-transform: uppercase; text-decoration: none; }
  nav .logoTech { color: var(--accent); }
  nav .navCta { flex: 0 0 auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
    background: var(--ink); color: #0a0a0c !important; text-decoration: none;
    padding: 12px 26px; border-radius: 3px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .2em; text-transform: uppercase; font-weight: 500; white-space: nowrap;
    transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(244,243,240,.22); }
  .btn.accent { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink) !important; border: 1px solid rgba(244,243,240,.4); }
  .btn.ghost:hover { border-color: var(--ink); }
  @media (max-width: 760px) {
    nav { padding: 14px 4vw; }
    nav .navCta { padding: 11px 16px; }
  }
  .daruma { height: 24px; width: auto; vertical-align: middle; opacity: .55; transition: opacity .3s, transform .3s; cursor: help; }
  .daruma:hover { opacity: 1; transform: translateY(-1px); }
  .daruma.foot { height: 46px; opacity: .6; cursor: pointer; }
  @keyframes okiagari { 0% { transform: rotate(0) } 22% { transform: rotate(-16deg) } 48% { transform: rotate(11deg) } 70% { transform: rotate(-6deg) } 88% { transform: rotate(2deg) } 100% { transform: rotate(0) } }
  .daruma.wobble { animation: okiagari 1s ease-out; transform-origin: 50% 88%; }
  @media (prefers-reduced-motion: reduce) { .daruma.wobble { animation: none; } }

  /* ── hero offer ── */
  .hero { position: relative; height: calc(100svh - 48px); min-height: 620px; overflow: hidden; max-width: none; padding: 0; }
  .heroMedia, .heroPoster, .heroVideo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .heroPoster, .heroVideo { object-fit: cover; object-position: center 42%; }
  .heroVideo { opacity: 0; transition: opacity .45s ease; }
  .heroVideo.playing { opacity: 1; }
  .heroVeil { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(5,5,6,.24), rgba(5,5,6,.24)),
                linear-gradient(to top, rgba(5,5,6,.88), rgba(5,5,6,.12) 62%),
                linear-gradient(105deg, rgba(5,5,6,.68) 0%, transparent 58%); }
  .heroContent { position: absolute; left: 6vw; right: 6vw; bottom: clamp(76px, 9vh, 96px); z-index: 2; max-width: 1120px; }
  .heroContent .eyebrow { margin-bottom: 14px; font-size: 12px; letter-spacing: .22em; }
  .heroContent h1 { font-weight: 900; text-transform: uppercase; letter-spacing: -.015em;
    font-size: clamp(58px, 8.2vw, 118px); line-height: .88; color: var(--ink); max-width: none; }
  .heroContent h1 span { display: block; }
  .heroLead { max-width: 68ch; margin-top: 16px; color: rgba(244,243,240,.9);
    font-size: clamp(16px, 1.45vw, 19px); line-height: 1.5; text-shadow: 0 1px 18px rgba(0,0,0,.7); }
  .heroProgram { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 0; max-width: 980px;
    margin-top: 16px; list-style: none; font-family: var(--mono); font-size: 12px; line-height: 1.4;
    letter-spacing: .08em; text-transform: uppercase; color: rgba(244,243,240,.82); }
  .heroProgram li { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .heroProgram li + li::before { content: '/'; margin: 0 12px; color: var(--accent); opacity: .76; }
  .heroProgram b { color: var(--accent); font-weight: 500; }
  .heroActions { display: flex; align-items: flex-start; margin-top: 18px; }
  .heroActions .btn { min-width: 190px; text-align: center; }
  .heroProof { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px;
    font-family: var(--mono); font-size: 11px; line-height: 1.5; letter-spacing: .08em;
    text-transform: uppercase; color: rgba(244,243,240,.78); }
  .heroProof b { color: var(--accent); font-weight: 500; }
  .heroProof span { position: relative; }
  .heroProof span + span::before { content: ''; position: absolute; left: -11px; top: .45em;
    width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
  .heroContinue { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 3;
    min-height: 44px; display: inline-flex; align-items: center; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(244,243,240,.82); text-decoration: none; text-shadow: 0 1px 8px rgba(0,0,0,.8);
    animation: heroContinueBob 2.4s ease-in-out 3; }
  .heroContinue:hover { color: var(--accent); }
  @keyframes heroContinueBob {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 4px); }
  }
  @media (prefers-reduced-motion: reduce) { .heroContinue { animation: none; } }
  @media (max-width: 760px) {
    .hero { min-height: 560px; }
    .heroContent { bottom: 62px; }
    .heroContent .eyebrow { margin-bottom: 12px; font-size: 10px; letter-spacing: .16em; }
    .heroContent h1 { font-size: clamp(34px, 10.5vw, 60px); letter-spacing: -.025em; }
    .heroLead { max-width: 39ch; margin-top: 12px; font-size: 15px; line-height: 1.42; }
    .heroProgram { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px;
      max-width: 520px; margin-top: 12px; font-size: 11px; letter-spacing: .04em; }
    .heroProgram li { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 5px; white-space: normal; }
    .heroProgram li + li::before { display: none; }
    .heroActions { margin-top: 14px; }
    .heroActions .btn { min-width: 0; padding: 12px 16px; }
    .heroProof { margin-top: 8px; gap: 4px 16px; font-size: 11px; letter-spacing: .04em; }
    .heroProof span + span::before { left: -9px; }
  }
  @media (max-width: 420px) {
    .heroContent { left: 5vw; right: 5vw; }
    .heroActions .btn { width: 100%; }
    .heroProof span { flex-basis: 100%; }
    .heroProof span + span::before { display: none; }
  }
  @media (max-width: 380px) and (max-height: 640px) {
    .hero { height: 568px; min-height: 568px; }
    .heroContent { top: 80px; bottom: auto; }
    .heroContent .eyebrow { margin-bottom: 8px; font-size: 9px; line-height: 1.45; letter-spacing: .1em; }
    .heroContent h1 { font-size: 34px; line-height: .86; }
    .heroLead { margin-top: 8px; font-size: 13px; line-height: 1.34; }
    .heroProgram { margin-top: 8px; gap: 5px 10px; font-size: 10px; line-height: 1.3; }
    .heroActions { margin-top: 10px; }
    .heroProof { margin-top: 6px; gap: 2px; font-size: 10px; line-height: 1.35; }
    .heroContinue { font-size: 9px; }
  }
  @media (max-height: 540px) and (min-width: 560px) {
    .hero { height: 100svh; min-height: 375px; }
    .heroContent { top: 92px; bottom: auto; }
    .heroContent .eyebrow { margin-bottom: 8px; font-size: 9px; }
    .heroContent h1 { max-width: none; font-size: clamp(42px, 6.4vw, 58px); line-height: .86; white-space: nowrap; }
    .heroLead { max-width: 78ch; margin-top: 8px; font-size: 12px; line-height: 1.35; }
    .heroProgram { margin-top: 8px; gap: 4px 0; font-size: 10px; }
    .heroProgram li + li::before { margin: 0 8px; }
    .heroActions { margin-top: 10px; }
    .heroProof { margin-top: 8px; }
    .heroContinue { display: none; }
  }

  /* ── dates band ── */
  .dates { padding-top: 90px; }
  .dates .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); margin-top: 34px; }
  .dates .cell { padding: 34px 30px; border-right: 1px solid var(--line); }
  .dates .cell:last-child { border-right: 0; }
  a.cell { transition: background .25s; }
  a.cell:hover { background: rgba(var(--accent-rgb),.05); }
  .dates .cell .when { font-weight: 800; text-transform: uppercase; font-size: clamp(26px, 3.4vw, 46px); letter-spacing: -.01em; line-height: 1; margin-top: 12px; }
  .dates .cell .what { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .dates .cell .note { margin-top: 10px; color: var(--dim); font-size: 14px; }
  .resline { display: inline-block; margin-top: 40px; font-weight: 600; font-size: clamp(10.5px, 2.7vw, 34px);

  .resline em { font-style: normal; color: var(--accent); }
  .resline:hover em { text-decoration: underline; text-underline-offset: 6px; }
  @media (max-width: 860px) {
    .dates .grid { grid-template-columns: 1fr; }
    .dates .cell { border-right: 0; border-bottom: 1px solid var(--line); }
    .dates .cell:last-child { border-bottom: 0; }
    .resline { white-space: normal; font-size: clamp(19px, 3.4vw, 30px); line-height: 1.4; }
  }

  /* ── summit + hotel package ── */
  .bundle-feature__promise { max-width: 58ch; color: var(--dim); font-size: 16px; line-height: 1.65; }
  .bundle-feature__promise strong { color: var(--ink); font-weight: 650; }

    font-variant-numeric: tabular-nums; }
  .bundle-feature__price span { display: block; margin-top: 10px; font-family: var(--mono); font-size: 9px; font-weight: 400;

  .bundle-feature__checkout { min-width: 250px; min-height: 50px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
  .bundle-feature__friction { margin-top: 16px; font-family: var(--mono); font-size: 10px; line-height: 1.6;

  .bundle-feature__links { display: flex; gap: 22px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  .bundle-feature__details { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); text-underline-offset: 4px; }

  /* ── bundle card: third card in the summits grid ── */
  .summit .card.pkg { grid-column: 1 / -1; gap: 0; padding: 32px 36px 30px;

  .pkg-top { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .pkg-top .num { color: var(--accent); }
  .pkg-top .eyebrow { margin: 0; }

    gap: 24px 48px; margin-top: 20px; align-items: start; }
  .pkg-pitch { display: flex; flex-direction: column; height: 100%; }
  .pkg-pitch h3 { font-size: clamp(24px, 2.3vw, 34px); line-height: 1.04; text-transform: uppercase;

  .pkg-foot { margin-top: auto; padding-top: 20px; }

<script id="luma-checkout"></script>
<script>
  const noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The package keeps a normal Luma href as its resilient fallback. Load the
  // enhanced overlay only when the package is near view or a pointer/focus
  // indicates intent, so its script and stylesheet do not compete with LCP.
  const lumaScript = document.getElementById('luma-checkout');
  function loadLumaCheckout() {
    if (lumaScript.src) return;
    lumaScript.src = 'https://embed.lu.ma/checkout-button.js';
    lumaScript.async = true;
  }
  document.querySelectorAll('[data-luma-action="checkout"]').forEach(link => {
    link.addEventListener('pointerenter', loadLumaCheckout, { once: true });
    link.addEventListener('focus', loadLumaCheckout, { once: true });
  });
  const packageSection = document.getElementById('summit-package');
  if (packageSection) {
    const lumaObserver = new IntersectionObserver(entries => {
      if (!entries.some(entry => entry.isIntersecting)) return;
      loadLumaCheckout();
      lumaObserver.disconnect();
    }, { rootMargin: '600px 0px' });
    lumaObserver.observe(packageSection);
  }

  // summit + hotel package is capped by spots, not by a date: set
  // MIRAI_COPY.js.packageSpotsLeft in copy.js. At 0 it falls back to standard pricing.
  if (MIRAI_COPY.js.packageSpotsLeft <= 0) {
    const offerLabel = document.querySelector('#summit-package .eyebrow');
    const offerPrice = document.querySelector('.bundle-feature__price');
    const total = MIRAI_COPY.js.packageSpotsTotal;
    if (offerLabel) offerLabel.textContent = MIRAI_COPY.js.packageSoldOutLabel;
    if (offerPrice) offerPrice.innerHTML =
      MIRAI_COPY.js.packageSoldOutPrice.replace(/\{spotsTotal\}/g, total);
    document.querySelectorAll('.bundle-checkout').forEach(a => {
      a.textContent = MIRAI_COPY.js.packageSoldOutCta;
      a.href = 'https://luma.com/an4zotn9?coupon=SFSH&utm_source=post-hotel-package&utm_campaign=post-hotel-package';
      a.dataset.lumaUtmSource = 'post-hotel-package';
    });
  }

  // early-bird window closes Aug 31 (JST): page self-heals to standard pricing
  const EB_END = new Date('2026-09-01T00:00:00+09:00').getTime();
  if (Date.now() >= EB_END) {
    document.documentElement.classList.add('ebOver');
    document.querySelectorAll('.ebTag, .left, .ebClock').forEach(el => el.remove());
    document.querySelectorAll('.ebPrice, .tracks .t .price').forEach(el => {
      const s = el.querySelector('s');
      if (s) el.textContent = s.textContent;
    });
  }

  // The poster is the only eager hero asset. Desktop video starts after the
  // poster has rendered and the main thread is idle; mobile/data-saver stays static.
  const hero = document.querySelector('.hero');
  const heroPoster = hero.querySelector('.heroPoster');
  const heroVideo = hero.querySelector('.heroVideo');
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const slowConnection = connection && /(^|-)2g$/.test(connection.effectiveType || '');
  const canPlayHeroVideo = !noMotion && matchMedia('(min-width: 761px)').matches &&
    !connection?.saveData && !slowConnection;

  function loadHeroVideo() {
    const source = heroVideo.querySelector('source[data-src]');
    if (!source || source.src) return;
    source.src = source.dataset.src;
    heroVideo.load();
    heroVideo.play().then(() => heroVideo.classList.add('playing')).catch(() => {});
  }

  function scheduleHeroVideo() {
    const start = () => loadHeroVideo();
    if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 2500 });
    else setTimeout(start, 1200);
  }

  if (canPlayHeroVideo) {
    if (heroPoster.complete) scheduleHeroVideo();
    else heroPoster.addEventListener('load', scheduleHeroVideo, { once: true });
  }

  new IntersectionObserver(es => es.forEach(e => {
    if (!heroVideo.currentSrc) return;
    if (e.isIntersecting) heroVideo.play().catch(() => {});
    else heroVideo.pause();
  }), { threshold: .05 }).observe(hero);

  // Fashion-show video gets a source only when its section approaches view.
  const fv = document.querySelector('.fashion video');
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      const source = fv.querySelector('source[data-src]');
      if (source && !source.src) {
        source.src = source.dataset.src;
        fv.load();
      }
      if (!noMotion && !connection?.saveData) fv.play().catch(() => {});
    } else fv.pause();
  }), { rootMargin: '200px 0px', threshold: .01 }).observe(fv);

  // reveal-on-scroll
  const ro = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); }
  }), { threshold: .12 });
  document.querySelectorAll('.rv').forEach(el => ro.observe(el));

  // kanji tap-to-reveal (touch has no title tooltips)
  document.querySelectorAll('.kanji span').forEach(k => {
    k.setAttribute('tabindex', '0');
    k.setAttribute('role', 'button');
    k.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); k.click(); } });
    k.addEventListener('click', () => {
      if (k._orig) return;
      k._orig = k.textContent;
      k.textContent = k.getAttribute('title').split(' — ')[0];
      setTimeout(() => { k.textContent = k._orig; k._orig = null; }, 1500);
    });
  });

  // placeholder links: never navigate, flash an honest note
  document.querySelectorAll('a[href="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      if (a._flash) return;
      a._flash = a.textContent;
      a.textContent = MIRAI_COPY.js.placeholderLink;
      const sr = document.getElementById('srStatus');
      sr.textContent = '';
      requestAnimationFrame(() => { sr.textContent = MIRAI_COPY.js.placeholderLink; });
      setTimeout(() => { a.textContent = a._flash; a._flash = null; }, 1400);
    });
  });

  // daruma: knock him over, he rights himself
  const df = document.getElementById('darumaFoot');
  df.addEventListener('click', () => {
    df.classList.remove('wobble');
    void df.offsetWidth;
    df.classList.add('wobble');
  });

  // countdown to Oct 1 2026 JST + live JST clock
  const t0 = new Date('2026-10-01T00:00:00+09:00').getTime();
  const JST_FMT = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Tokyo', weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const pad = n => String(n).padStart(2, '0');
  const ebClocks = [...document.querySelectorAll('.ebc')];
  function tick() {
    if (ebClocks.length) {
      let e = Math.max(0, EB_END - Date.now());
      const ed = Math.floor(e / 864e5), eh = Math.floor(e % 864e5 / 36e5),
            em = Math.floor(e % 36e5 / 6e4), es = Math.floor(e % 6e4 / 1e3);
      const t = pad(ed) + 'D · ' + pad(eh) + 'H · ' + pad(em) + 'M · ' + pad(es) + 'S';
      ebClocks.forEach(el => { el.textContent = t; });
    }
    let d = Math.max(0, t0 - Date.now());
    if (d === 0) document.getElementById('cdtext').textContent = MIRAI_COPY.js.countdownOpen;
    const day = Math.floor(d / 864e5); d -= day * 864e5;
    const hr = Math.floor(d / 36e5); d -= hr * 36e5;
    const mn = Math.floor(d / 6e4); d -= mn * 6e4;
    const sc = Math.floor(d / 1e3);
    cd.textContent = day; ch.textContent = pad(hr); cm.textContent = pad(mn); cs.textContent = pad(sc);
    jst.textContent = JST_FMT.format(new Date());
  }
  tick(); setInterval(tick, 1000);
</script>

</body>
</html>
