<style>
  :root {
    --bg: #050506;
    --ink: #f4f3f0;
    --dim: rgba(244,243,240,.62);
    --faint: rgba(244,243,240,.48);
    --line: rgba(244,243,240,.14);
    --accent: #9be8f0;
    --accent-rgb: 155, 232, 240;
    --font: 'Switzer', 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow-x: hidden; }
  .package-promo-fallback { display: none !important; }
  html.package-promo-hidden [data-package-promo] { display: none !important; }
  html.package-promo-hidden .package-promo-fallback { display: inline-block !important; }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .skip { position: fixed; top: 12px; left: 4vw; z-index: 70; background: var(--bg); color: var(--accent);
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    text-decoration: none; border: 1px solid rgba(var(--accent-rgb),.3); border-radius: 3px; padding: 12px 16px;
    transform: translateY(-200%); }
  .skip:focus { transform: none; }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
  section { position: relative; padding: 110px 6vw; max-width: 1440px; margin: 0 auto; }
  h2.big { font-weight: 800; text-transform: uppercase; letter-spacing: -.01em;
    font-size: clamp(34px, 5.2vw, 76px); line-height: .98; margin: 18px 0 10px; }
  .rule { border: 0; border-top: 1px solid var(--line); max-width: calc(1440px - 12vw); margin: 0 auto; }
  a { color: inherit; }

  /* reveal-on-scroll */
  .rv { opacity: 0; transform: translateY(22px); transition: opacity .8s ease, transform .8s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }

  /* ── nav ── */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
  nav { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4vw; background: rgba(5,5,6,.94);
    backdrop-filter: blur(14px); }
  nav .logo { font-weight: 800; letter-spacing: .06em; font-size: 15px; text-transform: uppercase; text-decoration: none; }
  nav .logo span { color: var(--accent); }
  nav .links { display: flex; gap: 26px; align-items: center; }
  nav .links a { font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim); text-decoration: none; transition: color .2s; }
  nav .links a:hover { color: var(--ink); }
  .btn { display: inline-block; background: var(--ink); color: #0a0a0c !important; text-decoration: none;
    padding: 12px 26px; border-radius: 3px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .2em; text-transform: uppercase; font-weight: 500; white-space: nowrap;
    transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(244,243,240,.22); }
  .btn.accent { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink) !important; border: 1px solid rgba(244,243,240,.4); }
  .btn.ghost:hover { border-color: var(--ink); }
  .menuBtn { display: none; border: 1px solid rgba(244,243,240,.4); background: none; color: var(--ink); cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    padding: 11px 14px; border-radius: 3px; transition: border-color .2s; }
  .menuBtn:hover { border-color: var(--ink); }
  .promo-short { display: none; }
  @media (max-width: 760px) {
    nav .links a:not(.btn) { display: none; }

    nav .links .btn { padding: 11px 16px; }
  }
  @media (min-width: 761px) and (max-width: 1050px) {

    .promo-short { display: inline; }
  }
  /* ── early-bird stripe (parks directly under the fixed nav) ── */
  .ebStripe { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap;
    padding: 9px 4vw; text-decoration: none;
    background: linear-gradient(180deg, #8c202a, #71161f);
    border-top: 1px solid rgba(255,255,255,.10);
    border-bottom: 1px solid rgba(0,0,0,.45);

    color: #fbeceb; transition: background .25s; }
  .ebStripe:hover { background: linear-gradient(180deg, #9c2531, #7d1a24); }
  .ebStripe .ebc { color: #fff; letter-spacing: .08em; font-variant-numeric: tabular-nums; font-weight: 500; }
  .ebStripe .ebs-sep { color: rgba(255,255,255,.3); }
  .ebStripe .ebs-price { letter-spacing: .08em; white-space: nowrap; }
  .ebStripe .ebs-price s { color: rgba(251,236,235,.55); text-decoration-thickness: 1px; margin-right: 8px; }
  .ebStripe .ebs-price b { color: #fff; font-weight: 700; font-size: 13px; }
  .ebStripe .ebs-cta { color: #fff; }
  @media (max-width: 980px) {
    .ebStripe { gap: 12px; font-size: 10px; letter-spacing: .12em; }
    .ebStripe .ebs-sep { display: none; }
  }
  @media (max-width: 760px) {
    .ebStripe { gap: 9px; padding: 8px 3vw; letter-spacing: .1em; }
    .ebStripe .ebs-cta { display: none; }
  }
  .ebStripe .ebs-label-short { display: none; }
  @media (max-width: 460px) {
    .ebStripe .ebs-label-full { display: none; }
    .ebStripe .ebs-label-short { display: inline; }
  }

  .menu { position: fixed; inset: 0; z-index: 60; background: rgba(5,5,6,.96); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 8vw;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s linear .3s; }
  .menu.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .3s ease; }
  .menu .mlink { font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; text-decoration: none;
    font-size: clamp(28px, 8vw, 40px); line-height: 1.25; color: var(--ink); }
  .menu .mlink span { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .2em;
    color: var(--accent); margin-left: 14px; vertical-align: middle; white-space: nowrap; }
  .menu .mdate { margin-top: 26px; font-family: var(--mono); font-size: 11px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--faint); }
  .menuClose { position: absolute; top: 12px; right: 4vw; width: 46px; height: 46px; border: 1px solid rgba(244,243,240,.4);
    background: none; color: var(--ink); border-radius: 3px; font-size: 16px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .menu, .menu.open { transition: none; } }
  .daruma { height: 24px; width: auto; vertical-align: middle; opacity: .55; transition: opacity .3s, transform .3s; cursor: help; }
  .daruma:hover { opacity: 1; transform: translateY(-1px); }
  .daruma.foot { height: 46px; opacity: .6; cursor: pointer; }
  @keyframes okiagari { 0% { transform: rotate(0) } 22% { transform: rotate(-16deg) } 48% { transform: rotate(11deg) } 70% { transform: rotate(-6deg) } 88% { transform: rotate(2deg) } 100% { transform: rotate(0) } }
  .daruma.wobble { animation: okiagari 1s ease-out; transform-origin: 50% 88%; }
  @media (prefers-reduced-motion: reduce) { .daruma.wobble { animation: none; } }

  /* ── hero sequence ── */
  .hero { position: relative; height: 100svh; overflow: hidden; max-width: none; padding: 0; }
  .slide { position: absolute; inset: 0; transform: translateX(100%); pointer-events: none;
    transition: transform 1.15s cubic-bezier(.77, 0, .175, 1); }
  .slide.on { transform: translateX(0); pointer-events: auto; }
  .slide.out { transform: translateX(-100%); }
  .slide:not(.on):not(.out) { transition: none; visibility: hidden; }
  .slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
  .slide .veil { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(5,5,6,.72), transparent 42%),
                linear-gradient(105deg, rgba(5,5,6,.55) 0%, transparent 52%); }
  .slide .content { position: absolute; left: 6vw; bottom: 13vh; max-width: 880px; }
  .slide h1 { font-weight: 900; text-transform: uppercase; letter-spacing: -.015em;
    font-size: clamp(40px, 9vw, 132px); line-height: .94; color: var(--ink);
    opacity: 0; transform: translateY(18px); transition: opacity .9s ease .45s, transform .9s ease .45s; }
  .slide.on h1 { opacity: 1; transform: none; }
  .slide .lead { margin-top: 18px; font-weight: 400; font-size: clamp(10.5px, 1.6vw, 19px); color: rgba(244,243,240,.78);
    white-space: nowrap; line-height: 1.6; letter-spacing: .01em;
    opacity: 0; transition: opacity .9s ease .95s; }
  .slide .lead em { font-style: normal; color: var(--accent); }
  .slide.on .lead { opacity: 1; }
  @keyframes popIn { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  .slide.on .pop { animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1) 1.35s both; }
  @media (prefers-reduced-motion: reduce) { .slide.on .pop { animation: none; } }
  .slide .sub { margin-top: 20px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap;

  .slide.on .sub { opacity: 1; }
  .slide .kicker { margin-bottom: 22px; font-size: 12px; opacity: 0; transition: opacity .8s ease .25s; }
  .slide.on .kicker { opacity: 1; }
  .heroDots { position: absolute; right: 4vw; bottom: 5vh; display: flex; gap: 4px; z-index: 5; flex-wrap: wrap; max-width: 88vw; justify-content: flex-end; }
  @media (max-width: 360px) {
    .heroDots button { padding: 8px 5px; letter-spacing: .1em; }

  }
  .heroDots button { border: 0; background: none; cursor: pointer; padding: 10px 8px;

  .scrollTag { position: absolute; left: 6vw; bottom: 4.5vh; font-family: var(--mono);

  @media (max-width: 760px) {

    .scrollTag { display: none; }
    .slide .content { left: 6vw; right: 6vw; bottom: 112px; max-width: none; }
    .slide .lead { white-space: normal; font-size: 15px; line-height: 1.55; max-width: 32ch; }

  .dates .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); margin-top: 34px; }

  /* ── summit + hotel package ── */
  .bundle-feature__promise { max-width: 58ch; color: var(--dim); font-size: 16px; line-height: 1.65; }
  .bundle-feature__promise strong { color: var(--ink); font-weight: 650; }

  .bundle-feature__checkout { min-width: 250px; min-height: 50px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }

<script id="luma-checkout" src="https://embed.lu.ma/checkout-button.js"></script>
<script>
  const noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // summit + hotel package is capped by spots, not by a date: set
  // MIRAI_COPY.js.packageSpotsLeft in copy.js. At 0 it falls back to standard pricing.
  if (MIRAI_COPY.js.packageSpotsLeft <= 0) {
    const offerLabel = document.querySelector('#summit-package .eyebrow');
    const offerPrice = document.querySelector('.bundle-feature__price');
    const total = MIRAI_COPY.js.packageSpotsTotal;
    if (offerLabel) offerLabel.textContent = MIRAI_COPY.js.packageSoldOutLabel;
    if (offerPrice) offerPrice.innerHTML =
      MIRAI_COPY.js.packageSoldOutPrice.replace(/\{spotsTotal\}/g, total);
    document.querySelectorAll('.bundle-checkout').forEach(a => {
      a.textContent = MIRAI_COPY.js.packageSoldOutCta;
      a.href = 'https://luma.com/an4zotn9?coupon=SFSH&utm_source=post-hotel-package&utm_campaign=post-hotel-package';
      a.dataset.lumaUtmSource = 'post-hotel-package';
    });
  }

  // mobile menu
  const menu = document.getElementById('menu'),
        menuBtn = document.getElementById('menuBtn'),
        menuClose = document.getElementById('menuClose');
  function setMenu(open) {
    menu.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    document.documentElement.style.overflow = open ? 'hidden' : '';
    (open ? menu.querySelector('.mlink') : menuBtn).focus();
  }
  menuBtn.addEventListener('click', () => setMenu(true));
  menuClose.addEventListener('click', () => setMenu(false));
  menu.querySelectorAll('.mlink').forEach(a => a.addEventListener('click', () => setMenu(false)));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && menu.classList.contains('open')) setMenu(false);
  });

  // early-bird window closes Aug 31 (JST): page self-heals to standard pricing
  const EB_END = new Date('2026-09-01T00:00:00+09:00').getTime();
  if (Date.now() >= EB_END) {
    document.documentElement.classList.add('ebOver');
    document.querySelectorAll('.ebTag, .left, .ebClock, .ebStripe').forEach(el => el.remove());
    document.querySelectorAll('.ebPrice, .tracks .t .price').forEach(el => {
      const s = el.querySelector('s');
      if (s) el.textContent = s.textContent;
    });
  }

  // hero sequence
  const slides = [...document.querySelectorAll('.hero .slide')];
  const WORDS = MIRAI_COPY.js.heroDotWords;
  const dotsWrap = document.getElementById('heroDots');
  slides.forEach((s, i) => {
    if (i !== 0) s.setAttribute('inert', '');
    const b = document.createElement('button');
    b.textContent = WORDS[i];
    b.setAttribute('aria-label', 'Slide ' + (i + 1) + ': ' + WORDS[i]);
    if (i === 0) { b.classList.add('active'); b.setAttribute('aria-current', 'true'); }
    b.addEventListener('click', () => { clearTimeout(timer); go(i); });
    dotsWrap.appendChild(b);
  });
  const pauseBtn = document.createElement('button');
  pauseBtn.textContent = '⏸';
  pauseBtn.setAttribute('aria-label', 'Pause slideshow');
  dotsWrap.appendChild(pauseBtn);
  const dotEls = [...dotsWrap.children].slice(0, slides.length);
  let cur = 0, timer = null, heroPaused = false;
  pauseBtn.addEventListener('click', () => {
    heroPaused = !heroPaused;
    pauseBtn.textContent = heroPaused ? '▶' : '⏸';
    pauseBtn.setAttribute('aria-label', heroPaused ? 'Play slideshow' : 'Pause slideshow');
    const v = slides[cur].querySelector('video');
    if (heroPaused) { clearTimeout(timer); if (v) v.pause(); }
    else { if (v) v.play().catch(() => {}); schedule(); }
  });

  function go(n) {
    if (n !== cur) {
      const old = cur;
      cur = (n + slides.length) % slides.length;
      const os = slides[old], ns = slides[cur];
      if (ns._reset) { clearTimeout(ns._reset); ns._reset = null; }
      ns.classList.remove('out');
      void ns.offsetWidth;
      os.classList.remove('on');
      os.classList.add('out');
      os.setAttribute('inert', '');
      dotEls[old].classList.remove('active');
      dotEls[old].removeAttribute('aria-current');
      ns.classList.add('on');
      ns.removeAttribute('inert');
      dotEls[cur].classList.add('active');
      dotEls[cur].setAttribute('aria-current', 'true');
      const v = ns.querySelector('video');
      if (v && v.paused && !heroPaused) v.play().catch(() => {});
      os._reset = setTimeout(() => {
        os._reset = null;
        os.classList.remove('out');
        const ov = os.querySelector('video');
        if (ov && !os.classList.contains('on')) ov.pause();
      }, 1250);
    }
    if (!heroPaused) schedule();
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(() => go(cur + 1), +slides[cur].dataset.dur || 6000);
  }
  slides[0].querySelector('video').play().catch(() => {});
  schedule();
  // low-power-mode insurance: first gesture retries playback
  const kick = () => {
    const v = slides[cur].querySelector('video');
    if (v && v.paused && !heroPaused) v.play().catch(() => {});
    document.removeEventListener('touchstart', kick);
    document.removeEventListener('click', kick);
  };
  document.addEventListener('touchstart', kick, { once: true });
  document.addEventListener('click', kick, { once: true });

  // hero sleeps off-screen (battery)
  const hero = document.querySelector('.hero');
  new IntersectionObserver(es => es.forEach(e => {
    const v = slides[cur].querySelector('video');
    if (e.isIntersecting) {
      if (v && !heroPaused) v.play().catch(() => {});
      if (!heroPaused) schedule();
    } else {
      clearTimeout(timer);
      if (v) v.pause();
    }
  }), { threshold: .05 }).observe(hero);

  // fashion-show video: play on scroll into view
  const fv = document.querySelector('.fashion video');
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { fv.play().catch(() => {}); } else { fv.pause(); }
  }), { threshold: .2 }).observe(fv);

  // reveal-on-scroll
  const ro = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); }
  }), { threshold: .12 });
  document.querySelectorAll('.rv').forEach(el => ro.observe(el));

  // kanji tap-to-reveal (touch has no title tooltips)
  document.querySelectorAll('.kanji span').forEach(k => {
    k.setAttribute('tabindex', '0');
    k.setAttribute('role', 'button');
    k.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); k.click(); } });
    k.addEventListener('click', () => {
      if (k._orig) return;
      k._orig = k.textContent;
      k.textContent = k.getAttribute('title').split(' — ')[0];
      setTimeout(() => { k.textContent = k._orig; k._orig = null; }, 1500);
    });
  });

  // placeholder links: never navigate, flash an honest note
  document.querySelectorAll('a[href="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      if (a._flash) return;
      a._flash = a.textContent;
      a.textContent = MIRAI_COPY.js.placeholderLink;
      const sr = document.getElementById('srStatus');
      sr.textContent = '';
      requestAnimationFrame(() => { sr.textContent = MIRAI_COPY.js.placeholderLink; });
      setTimeout(() => { a.textContent = a._flash; a._flash = null; }, 1400);
    });
  });

  // daruma: knock him over, he rights himself
  const df = document.getElementById('darumaFoot');
  df.addEventListener('click', () => {
    df.classList.remove('wobble');
    void df.offsetWidth;
    df.classList.add('wobble');
  });

  // countdown to Oct 1 2026 JST + live JST clock
  const t0 = new Date('2026-10-01T00:00:00+09:00').getTime();
  const JST_FMT = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Tokyo', weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const pad = n => String(n).padStart(2, '0');
  const ebClocks = [...document.querySelectorAll('.ebc')];
  function tick() {
    if (ebClocks.length) {
      let e = Math.max(0, EB_END - Date.now());
      const ed = Math.floor(e / 864e5), eh = Math.floor(e % 864e5 / 36e5),
            em = Math.floor(e % 36e5 / 6e4), es = Math.floor(e % 6e4 / 1e3);
      const t = pad(ed) + 'D · ' + pad(eh) + 'H · ' + pad(em) + 'M · ' + pad(es) + 'S';
      ebClocks.forEach(el => { el.textContent = t; });
    }
    let d = Math.max(0, t0 - Date.now());
    if (d === 0) document.getElementById('cdtext').textContent = MIRAI_COPY.js.countdownOpen;
    const day = Math.floor(d / 864e5); d -= day * 864e5;
    const hr = Math.floor(d / 36e5); d -= hr * 36e5;
    const mn = Math.floor(d / 6e4); d -= mn * 6e4;
    const sc = Math.floor(d / 1e3);
    cd.textContent = day; ch.textContent = pad(hr); cm.textContent = pad(mn); cs.textContent = pad(sc);
    jst.textContent = JST_FMT.format(new Date());
  }
  tick(); setInterval(tick, 1000);
</script>

</body>
