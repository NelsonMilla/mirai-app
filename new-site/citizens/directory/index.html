<style>
  :root {
    --bg: #050506; --ink: #f4f3f0; --dim: rgba(244,243,240,.62); --faint: rgba(244,243,240,.45);
    --line: rgba(244,243,240,.14); --accent: #9be8f0; --accent-rgb: 155,232,240;
    --font: 'Switzer', 'Inter', -apple-system, sans-serif; --mono: 'IBM Plex Mono', monospace;
    --hud: rgba(5,5,6,.9); --paper: #0b0c0f; --paper-2: #101216;
    --red: #d8322b; --red-rgb: 216,50,43;
    --ease: cubic-bezier(.2,.7,.2,1); --gap: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { min-width: 320px; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* the same corner-bracket panel as the map, quests and links */
  .panel { position: relative; background: var(--hud); border: 1px solid var(--line); }
  .panel::before, .panel::after { content: ''; position: absolute; width: 9px; height: 9px; pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
  .panel::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: var(--gap) var(--gap) 60px; }

  /* ---------- top: the lead line (the title lives in the shared header, /citizens/nav.js) ---------- */
  .lead { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--dim); max-width: 64ch; }
  .lead a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(var(--accent-rgb), .4); }
  .lead a:hover { text-decoration-color: var(--accent); }

  .state { margin-top: 28px; padding: 40px 0; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .state.err { color: var(--red); }

  /* ---------- the grid ---------- */
  .grid { margin-top: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

  .card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; }
  .card.you { border-color: var(--accent); }

  .card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .no { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .card .you-tag { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #04191c;
    background: var(--accent); border-radius: 2px; padding: 3px 7px; }

  .card .face { display: flex; justify-content: center; padding: 6px 0 2px; }
  .card .face img { image-rendering: pixelated; }

  .card .name { font-weight: 800; font-size: 15px; line-height: 1.15; text-transform: uppercase; letter-spacing: .01em; text-align: center; }
  .card .bio { font-size: 12.5px; line-height: 1.45; color: var(--dim); text-align: center; }

  .card .links { margin-top: auto; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .card .lnk { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
    text-decoration: none; border: 1px solid rgba(var(--accent-rgb), .3); border-radius: 2px; padding: 9px 9px; display: inline-flex; align-items: center;
    transition: border-color .2s, background-color .2s; }
  .card .lnk:hover { border-color: var(--accent); background: rgba(var(--accent-rgb), .06); }
  .card .edit { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
    text-decoration: none; border: 1px solid var(--line); border-radius: 2px; padding: 9px 9px; display: inline-flex; align-items: center;
    transition: border-color .2s, color .2s; }
  .card .edit:hover { border-color: var(--accent); color: var(--accent); }

  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline;
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  footer b { color: var(--dim); font-weight: 400; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    :root { --gap: 10px; }
    .lead { font-size: 13px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 12px 10px 14px; }
    .card .name { font-size: 13.5px; }
    .card .bio { font-size: 11.5px; }
  }
  @media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card .lnk, .card .edit { transition: none; }
  }
</style>
</head>
<body data-analytics-offer="citizens">

<script src="/citizens/nav.js" data-screen="directory" data-title="Directory"></script>

<div class="wrap">
  <p class="lead" id="lead">
    These are citizens of Mirai Tech City, Kobe, October 2026.
    <a href="/citizens/you/" id="createLink" data-analytics-action="site_navigation" data-analytics-location="citizens_directory" data-analytics-target="create">Create your citizen</a>
  </p>

  <p class="state" id="state">Loading&hellip;</p>
  <div class="grid" id="grid" hidden></div>

  <footer>
    <b>Mirai Tech City</b> <span>Kobe &middot; Oct 1&ndash;31 2026</span>
    <a href="/citizens/">Map &rarr;</a>
  </footer>
</div>

<script src="/citizens/avatar/avatar.js"></script>
<script src="/citizens/avatar/config.js"></script>
<script src="/citizens/avatar/db.js"></script>
<script>
(function () {
  var stateEl = document.getElementById('state');
  var gridEl = document.getElementById('grid');

  function dbConfigured() {
    try { return typeof window.MTCDb !== 'undefined' && !!MTCDb.configured(); } catch (e) { return false; }
  }

  function padNo(n) {
    n = Number(n) || 0;
    return n < 10 ? '00' + n : (n < 100 ? '0' + n : String(n));
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function linksHtml(x, linkedin) {
    var html = '';
    if (x) {
      html += '<a class="lnk" href="https://x.com/' + encodeURIComponent(x) + '" target="_blank" rel="noopener" ' +
        'data-analytics-action="site_navigation" data-analytics-location="citizens_directory" data-analytics-target="x">X</a>';
    }
    if (linkedin) {
      html += '<a class="lnk" href="' + esc(linkedin) + '" target="_blank" rel="noopener" ' +
        'data-analytics-action="site_navigation" data-analytics-location="citizens_directory" data-analytics-target="linkedin">LinkedIn</a>';
    }
    return html;
  }

  function buildCard(entry, noLabel, isYou) {
    var card = document.createElement('article');
    card.className = 'card' + (isYou ? ' you' : '');

    var head = document.createElement('div');
    head.className = 'head';
    var no = document.createElement('span');
    no.className = 'no';
    no.textContent = noLabel;
    head.appendChild(no);
    if (isYou) {
      var tag = document.createElement('span');
      tag.className = 'you-tag';
      tag.textContent = 'You';
      head.appendChild(tag);
    }
    card.appendChild(head);

    var face = document.createElement('div');
    face.className = 'face';
    face.setAttribute('role', 'img');
    face.setAttribute('aria-label', entry.name);
    card.appendChild(face);

    var name = document.createElement('p');
    name.className = 'name';
    name.textContent = entry.name;
    card.appendChild(name);

    var bio = document.createElement('p');
    bio.className = 'bio';
    bio.textContent = entry.bio || '';
    card.appendChild(bio);

    var links = document.createElement('div');
    links.className = 'links';
    links.innerHTML = linksHtml(entry.x, entry.linkedin);
    if (isYou) {
      links.innerHTML += '<a class="edit" href="/citizens/you/" ' +
        'data-analytics-action="site_navigation" data-analytics-location="citizens_directory" data-analytics-target="edit">Edit</a>';
    }
    card.appendChild(links);

    gridEl.appendChild(card);
    MTCAvatar.render(face, entry.code, { scale: 3 });
  }

  // today's fallback: the local JSON file + the local profile for the "You" card. Used whenever
  // MTCDb is absent, not configured, or any db call rejects (including NOT_CONFIGURED) — no error
  // is shown to the user in that case; "Could not load the directory." only fires if this also fails.
  function renderFromJsonFallback() {
    fetch('/citizens/data/citizens.json')
      .then(function (res) {
        if (!res.ok) throw new Error('bad response');
        return res.json();
      })
      .then(function (citizens) {
        gridEl.innerHTML = '';

        var profile = null;
        try { profile = MTCAvatar.loadProfile(); } catch (e) { profile = null; }

        if (profile && profile.code) {
          buildCard({
            name: profile.name || 'You',
            bio: profile.bio || '',
            x: profile.x || null,
            linkedin: profile.linkedin || null,
            code: profile.code
          }, 'No. —', true);
        }

        citizens.forEach(function (entry, i) {
          var n = i + 1;
          var noLabel = 'No. ' + (n < 10 ? '00' + n : (n < 100 ? '0' + n : n));
          buildCard(entry, noLabel, false);
        });

        stateEl.hidden = true;
        gridEl.hidden = false;
      })
      .catch(function () {
        stateEl.textContent = 'Could not load the directory.';
        stateEl.classList.add('err');
      });
  }

  // db-first: listCitizens() for the grid, myCitizen() (if signed in) for the "You" card. Any
  // failure here — including NOT_CONFIGURED — falls back to the JSON file exactly as today.
  function renderFromDb() {
    // listCitizens() starts right away; myCitizen() only once we know (by awaiting
    // MTCDb.session(), which is always a Promise — never read it as if it were the session
    // itself) whether anyone is actually signed in.
    var listP = MTCDb.listCitizens();
    var meP = MTCDb.session().catch(function () { return null; }).then(function (sess) {
      return sess ? MTCDb.myCitizen().catch(function () { return null; }) : null;
    });

    Promise.all([listP, meP]).then(function (results) {
      var list = results[0] || [], me = results[1];
      gridEl.innerHTML = '';

      if (me) {
        buildCard({ name: me.name, bio: me.bio, x: me.x, linkedin: me.linkedin, code: me.code }, 'No. ' + padNo(me.no), true);
      } else {
        var profile = null;
        try { profile = MTCAvatar.loadProfile(); } catch (e) { profile = null; }
        if (profile && profile.code) {
          buildCard({
            name: profile.name || 'You',
            bio: profile.bio || '',
            x: profile.x || null,
            linkedin: profile.linkedin || null,
            code: profile.code
          }, 'No. —', true);
        }
      }

      list.forEach(function (entry) {
        if (me && entry.no === me.no) return; // already shown above as the "You" card
        buildCard(entry, 'No. ' + padNo(entry.no), false);
      });

      stateEl.hidden = true;
      gridEl.hidden = false;
    }).catch(function () {
      renderFromJsonFallback();
    });
  }

  if (dbConfigured()) {
    renderFromDb();
  } else {
    renderFromJsonFallback();
  }
})();
</script>
</body>
</html>
